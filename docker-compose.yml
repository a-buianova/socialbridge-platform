services:
  crm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialbridge_crm
      POSTGRES_USER: socialbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_only_change_me}
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialbridge -d socialbridge_crm"]
      interval: 5s
      timeout: 5s
      retries: 12
  crm-service:
    build:
      context: .
      dockerfile: crm-service/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://crm-db:5432/socialbridge_crm
      DB_USER: socialbridge
      DB_PASSWORD: ${DB_PASSWORD:-local_only_change_me}
    depends_on:
      crm-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 18
volumes:
  crm_db_data:
