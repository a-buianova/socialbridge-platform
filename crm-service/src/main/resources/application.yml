server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: crm-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/socialbridge_crm}
    username: ${DB_USER:socialbridge}
    password: ${DB_PASSWORD:local_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: ecs
  level:
    # PostgreSQL constraint details can include a conflicting email address.
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
