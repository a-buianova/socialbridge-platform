server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: crm-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/socialbridge_crm}
    username: ${DB_USER:socialbridge}
    password: ${DB_PASSWORD:local_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
